application:
  name: "GPHI-TTS"
  environment: "development"
  # Cần kiểm tra và thay bằng thông tin doanh nghiệp thật trước khi phát hành.
  manufacturer: "CÔNG TY CỔ PHẦN ĐẦU TƯ GIẢI PHÁP HỮU ÍCH"
  address: "Lô 17, Khu nhà liền kề Chung cư Simona, đường Hoàng Văn Thụ, Phường Quy Nhơn Nam, Tỉnh Gia Lai"
  phone: "0347775677" 
  website: "https://gphi.tech/" # Cần thay bằng website thật.
  support_email: "gphi@gmail.com.vn" # Cần thay bằng email hỗ trợ thật.
  copyright: "© 2026 CÔNG TY CỔ PHẦN ĐẦU TƯ GIẢI PHÁP HỮU ÍCH." # Cần thay bằng thông tin bản quyền thật.

paths:
  # Read-only in a packaged build; VieNeu v3 is bundled here for offline startup.
  bundled_models_dir: "resources/models"
  models_dir: "models"
  data_dir: "data"
  cache_dir: "data/cache"
  logs_dir: "data/logs"

tts:
  default_engine: "vieneu-v3"
  production_default_engine: "vieneu-v3"

# Endpoint tạm để kiểm thử backend localhost. Thay bằng URL production khi có server.
payment:
  api_endpoint: "http://127.0.0.1:8000/payment/request"
  request_timeout_seconds: 10
  # Giá mẫu; có thể chỉnh trực tiếp tại đây trước khi phát hành.
  plan_prices_vnd:
    monthly: 99000
    quarterly: 249000
    semiannual: 449000
    yearly: 799000
    lifetime: 1999000

audio:
  default_speed: 1.0
  default_pitch_semitones: 0.0
  default_volume_db: 0.0
  default_sample_rate: 24000

# Đây là ngưỡng khởi đầu có thể điều chỉnh, không phải thông số hiệu năng đã được chứng minh.
hardware_recommendation:
  high_tier:
    min_ram_gb: 16
    min_physical_cores: 6
    min_vram_gb: 1
  medium_tier:
    min_ram_gb: 8
    min_physical_cores: 4

logging:
  level: "INFO"
  retention_days: 7
